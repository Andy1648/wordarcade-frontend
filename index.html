    <!-- Browser translate extensions (Edge/Chrome "Translate this page", Google Translate)
         REPLACE text nodes in place. React still holds references to the originals, so its
         next reconcile calls removeChild on a node the extension already swapped out — the
         "NotFoundError: Failed to execute 'removeChild' on 'Node'" the ErrorBoundary catches
         on /room/:code, where names / the word feed / the timer re-render every second.
         This opts the page out of Google's auto-translate offer; the page's STATIC copy is
         still translatable by hand. The VOLATILE nodes carry their own translate="no" (see
         GameScreen.jsx + RoomScreen.jsx) — do NOT put notranslate on <html>/<body>, that
         would lock non-English players out of translating the menu and rules. -->
    <meta name="google" content="notranslate" />
    <script>try{localStorage['taw.reduceMotion']=='1'&&document.documentElement.setAttribute('data-reduce-motion',1)}catch(e){}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Self-hosted Bungee Shade (the huge menu wordmark): preload the latin woff2
         from our own origin so the display font arrives early and the FOUT layout
         shift on first paint is minimal. Same-origin font fetches are still CORS
         (anonymous), so `crossorigin` is required for the preload to match the
         @font-face fetch and avoid a double-fetch. (@font-face is in index.css.)
         Bungee Shade is dropped from the Google link below since we host it now;
         Bungee + Space Mono still load from Google via display=swap. -->
    <link rel="preload" href="/fonts/bungee-shade-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Google Fonts CSS loaded NON-render-blocking (perf/assets, Job 17): media="print" +
         onload swap so the stylesheet parse never blocks first paint. Every family is
         display=swap, so text paints in the fallback immediately regardless; <noscript>
         keeps it working with JS off. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Bungee+Inline&family=Bungee+Outline&family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Bungee+Inline&family=Bungee+Outline&family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
