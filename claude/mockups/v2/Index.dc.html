<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Index screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bungee+Shade&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Space Mono',monospace;color:#fff;background:#0d0618}
a.ix-link{color:#fff;text-decoration:none}
a.ix-link:hover{color:#FFE94A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0d0618">
<div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(-28deg, transparent 0 46px, rgba(92,15,163,.16) 46px 50px)"></div>

<div style="position: absolute; left: 48px; right: 48px; top: 28px; height: 96px; display: flex; align-items: center; justify-content: space-between">
<a class="ix-link" href="Main.dc.html" style="display: flex; align-items: center; height: 56px; padding: 0 20px; background: #1a0b2e; border: 4px solid #5c0fa3; box-shadow: 6px 6px 0 #000; font-family: 'Bungee', sans-serif; font-size: 20px">← ROLL</a>
<div style="display: flex; align-items: baseline; gap: 18px">
<span style="font-family: 'Bungee Shade', 'Bungee', sans-serif; font-size: 60px; line-height: 1; color: #2EFFE0">INDEX</span>
<span style="font-family: 'Bungee', sans-serif; font-size: 44px; color: #FFE94A; -webkit-text-stroke: 5px #000; paint-order: stroke fill">9/27</span>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="6">
<div style="width: 64px; height: 56px; box-sizing: border-box; background: {{t.fill}}; border: 4px solid #000; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="width: 22px; height: 6px; background: {{t.line}}; border: 2px solid #000"></span>
<span style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #fff">{{t.count}}</span>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 48px; right: 48px; top: 150px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 28px; justify-items: center">
<sc-for list="{{cards}}" as="item" hint-placeholder-count="12">
<div style="width: 156px; height: 225px; position: relative">
<dc-import name="MarkCard" m="{{item.m}}" w="156" h="225" hint-size="156px,225px"></dc-import>
<sc-if value="{{item.isMain}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: -12px; right: -10px; padding: 2px 8px; background: #FFE94A; border: 3px solid #000; box-shadow: 3px 3px 0 #000; font-family: 'Bungee', sans-serif; font-size: 14px; color: #000; transform: rotate(6deg)">MAIN</div>
</sc-if>
<sc-if value="{{item.toNext}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 13px; color: #c9b8e8">{{item.toNext}}</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
var RAR = {
  common:    { name: 'COMMON',    rank: 0, odds: '1 IN 2',    line: '#A9B4C8', fill: '#262b38', inner: '#5d6678' },
  rare:      { name: 'RARE',      rank: 1, odds: '1 IN 10',   line: '#3D8BFF', fill: '#0f2350', inner: '#1f4fa8' },
  epic:      { name: 'EPIC',      rank: 2, odds: '1 IN 100',  line: '#B04BFF', fill: '#2a0e4a', inner: '#6a20b0' },
  legendary: { name: 'LEGENDARY', rank: 3, odds: '1 IN 1K',   line: '#FFC23D', fill: '#3d2a05', inner: '#b07a10' },
  mythic:    { name: 'MYTHIC',    rank: 4, odds: '1 IN 10K',  line: '#FF3D7F', fill: '#4a0a22', inner: '#a8164e' },
  secret:    { name: 'SECRET',    rank: 5, odds: '1 IN 100K', line: '#FFFFFF', fill: '#050208', inner: '#1c1c22' }
};
var NEED = { common: 10, rare: 5, epic: 3, legendary: 2, mythic: 1, secret: 1 };
var MARKS = [
  { id: 'spark',  name: 'SPARK',     r: 'common',    g: 'bolt',  num: '+10%', kind: 'WINS', own: 3, have: 7 },
  { id: 'ink',    name: 'INKBLOT',   r: 'common',    g: 'drop',  num: '+5',   kind: 'BASE XP', own: 1, have: 4 },
  { id: 'dash',   name: 'DASH',      r: 'common',    g: 'arrow', num: '+10%', kind: 'XP', own: 2, have: 1 },
  { id: 'wick',   name: 'WICK',      r: 'rare',      g: 'flame', num: '+20',  kind: 'BASE WINS', own: 1, have: 2 },
  { id: 'glint',  name: 'GLINT',     r: 'rare',      g: 'eye',   num: '+25%', kind: 'XP', own: 1, have: 0 },
  { id: 'crown',  name: 'CROWNLESS', r: 'epic',      g: 'crown', num: '×1.5', kind: 'WINS', own: 1, have: 1, main: true },
  { id: 'tide',   name: 'TIDE',      r: 'epic',      g: 'drop',  num: '+15%', kind: 'LUCK', own: 0 },
  { id: 'key',    name: 'GOLD KEY',  r: 'legendary', g: 'key',   num: '×3',   kind: 'WINS', perk: 'KEY −20%', own: 1, have: 0 },
  { id: 'blaze',  name: 'BLAZE',     r: 'legendary', g: 'flame', num: '×3',   kind: 'XP', perk: 'OVERDRIVE ×2', own: 0 },
  { id: 'nova',   name: 'NOVA',      r: 'mythic',    g: 'star',  num: '×10',  kind: 'WINS', perk: 'GEMS ×2', own: 0 },
  { id: 'zap',    name: 'ZAP',       r: 'mythic',    g: 'bolt',  num: '×10',  kind: 'XP', perk: 'LUCK ×2', own: 0 },
  { id: 'void',   name: 'VOID',      r: 'secret',    g: 'eye',   num: '×25',  kind: 'WINS', perk: '10TH WORD ×100', own: 0 }
];
function pips(n) { var s = ''; for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆'; return s; }
function card(mk) {
  var R = RAR[mk.r];
  var g = {}; g[mk.g] = true;
  var locked = !mk.own;
  return {
    name: locked ? '???' : mk.name, rarityName: R.name, oddsText: R.odds,
    fill: locked ? '#120a1c' : R.fill, line: R.line, inner: locked ? '#0b0612' : R.inner,
    cogClass: !locked && R.rank >= 2 ? 'mc-cog' : 'mc-still',
    toothClass: mk.r === 'secret' ? 'mc-rb' : '',
    glow: !locked && R.rank >= 2, shine: !locked && R.rank >= 2,
    g: g, glyphFilter: locked ? 'brightness(0) opacity(.9)' : 'none',
    statNum: locked ? mk.num : mk.num, statKind: mk.kind,
    statColor: locked ? '#5d4a78' : '#FFE94A',
    hasPerk: !!mk.perk, perk: mk.perk || '',
    pipsText: locked ? '' : pips(mk.own - 1)
  };
}
class Component extends DCLogic {
  renderVals() {
    var order = ['common', 'rare', 'epic', 'legendary', 'mythic', 'secret'];
    var tiers = order.map(function (r) {
      var all = MARKS.filter(function (m) { return m.r === r; });
      var got = all.filter(function (m) { return m.own; }).length;
      return { line: RAR[r].line, fill: RAR[r].fill, count: got + '/' + all.length };
    });
    var cards = MARKS.map(function (mk) {
      var next = '';
      if (mk.own && mk.own < 6) next = mk.have + '/' + NEED[mk.r] + ' → ★' + mk.own;
      return { m: card(mk), isMain: !!mk.main, toNext: next };
    });
    return { tiers: tiers, cards: cards };
  }
}
</script>
</body>
</html>
