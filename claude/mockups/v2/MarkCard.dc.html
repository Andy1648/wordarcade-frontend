<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bungee+Shade&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Space Mono',monospace;color:#fff}
@keyframes mcShine{0%{transform:translateX(-160%) skewX(-20deg)}55%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes mcSpin{to{transform:rotate(360deg)}}
@keyframes mcRainbow{0%{fill:#FF3D7F}20%{fill:#FFC23D}40%{fill:#2EFFE0}60%{fill:#3D8BFF}80%{fill:#B04BFF}100%{fill:#FF3D7F}}
@keyframes mcPulse{0%,100%{opacity:.55}50%{opacity:1}}
.mc-shine{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mc-shine::after{content:"";position:absolute;top:0;bottom:0;width:34%;background:rgba(255,255,255,.28);animation:mcShine 2.6s ease-in-out infinite}
.mc-cog{animation:mcSpin 16s linear infinite;transform-origin:60px 60px}
.mc-still{}
.mc-rb{animation:mcRainbow 1.6s linear infinite}
.mc-glow{animation:mcPulse 1.8s ease-in-out infinite}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative">
<div style="position: absolute; left: 0; top: 0; width: 180px; height: 260px; transform: scale({{s}}); transform-origin: 0 0; box-sizing: border-box; background: {{m.fill}}; border: 5px solid #000; border-radius: 10px; box-shadow: 6px 6px 0 #000; overflow: hidden; display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; height: 28px; box-sizing: border-box; padding: 0 8px; background: {{m.line}}; border-bottom: 4px solid #000; display: flex; align-items: center; justify-content: space-between; color: #000; font-family: 'Bungee', sans-serif; font-size: 13px; letter-spacing: 0.04em">
<span>{{m.rarityName}}</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px">{{m.oddsText}}</span>
</div>
<div style="position: relative; width: 132px; height: 132px; margin-top: 6px">
<sc-if value="{{m.glow}}" hint-placeholder-val="{{ false }}">
<div class="mc-glow" style="position: absolute; inset: -6px; border-radius: 50%; background: {{m.line}}; opacity: .6; filter: blur(14px)"></div>
</sc-if>
<svg viewBox="0 0 120 120" width="132" height="132" style="position: relative; display: block; overflow: visible">
<g class="{{m.cogClass}}">
<g stroke="#000" stroke-width="3" stroke-linejoin="round">
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(30 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(60 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(90 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(120 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(150 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(180 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(210 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(240 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(270 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(300 60 60)"></rect>
<rect class="{{m.toothClass}}" x="51" y="1" width="18" height="20" rx="2" fill="{{m.line}}" transform="rotate(330 60 60)"></rect>
</g>
<circle cx="60" cy="60" r="44" fill="{{m.line}}" stroke="#000" stroke-width="5"></circle>
</g>
<circle cx="60" cy="60" r="35" fill="{{m.inner}}" stroke="#000" stroke-width="4"></circle>
<g style="filter: drop-shadow(3px 3px 0 #000)">
<g transform="translate(24 24) scale(0.72)" stroke="#0d0618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" style="filter: {{m.glyphFilter}}">
<sc-if value="{{m.g.bolt}}" hint-placeholder-val="{{ false }}"><g transform="rotate(-8 50 50)">
<path d="M60 6 L24 56 L46 56 L36 94 L78 38 L56 38 Z" fill="#FFE94A" stroke="none"></path>
<path d="M56 38 L78 38 L36 94 L44 60 Z" fill="#F2A900" stroke="none"></path>
<path d="M60 6 L24 56 L46 56 L36 94 L78 38 L56 38 Z" fill="none"></path>
<path d="M53 17 L35 44" stroke="#fff" stroke-width="5" fill="none"></path>
<path d="M86 12 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fff" stroke-width="3"></path>
<path d="M14 80 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#2EFFE0" stroke-width="2.5"></path>
<path d="M82 66 L92 70 M80 78 L88 84" stroke="#FFE94A" stroke-width="4" fill="none"></path>
</g></sc-if>
<sc-if value="{{m.g.drop}}" hint-placeholder-val="{{ false }}"><g transform="rotate(10 50 50)">
<path d="M50 8 C50 8 20 46 20 64 C20 82 34 92 50 92 C66 92 80 82 80 64 C80 46 50 8 50 8 Z" fill="#2EFFE0" stroke="none"></path>
<path d="M62 32 C74 48 80 58 80 66 C80 82 66 92 50 92 C64 84 70 72 68 58 C67 48 64 40 62 32 Z" fill="#12A99A" stroke="none"></path>
<path d="M50 8 C50 8 20 46 20 64 C20 82 34 92 50 92 C66 92 80 82 80 64 C80 46 50 8 50 8 Z" fill="none"></path>
<path d="M34 64 C34 54 38 46 44 40" stroke="#fff" stroke-width="6" fill="none"></path>
<circle cx="36" cy="74" r="4" fill="#fff" stroke="none"></circle>
<path d="M86 26 C86 26 79 36 79 41 C79 45 82 48 86 48 C90 48 93 45 93 41 C93 36 86 26 86 26 Z" fill="#2EFFE0" stroke-width="4"></path>
</g></sc-if>
<sc-if value="{{m.g.arrow}}" hint-placeholder-val="{{ false }}"><g transform="rotate(-10 50 50)">
<path d="M10 40 L56 40 L56 20 L92 50 L56 80 L56 60 L10 60 Z" fill="#FF4FA3" stroke="none"></path>
<path d="M10 51 L56 51 L56 80 L92 50 L84 44 L62 64 L62 51 Z" fill="#C2187A" stroke="none"></path>
<path d="M10 40 L56 40 L56 20 L92 50 L56 80 L56 60 L10 60 Z" fill="none"></path>
<path d="M16 45 L48 45 M60 30 L76 44" stroke="#fff" stroke-width="4" fill="none"></path>
<path d="M-2 34 L-14 34 M2 50 L-18 50 M-2 66 L-12 66" stroke="#2EFFE0" stroke-width="5"></path>
</g></sc-if>
<sc-if value="{{m.g.flame}}" hint-placeholder-val="{{ false }}"><g>
<path d="M52 4 C64 26 84 38 78 64 C74 82 62 94 48 94 C32 94 20 82 22 62 C24 46 36 40 38 24 C44 32 46 38 50 42 C54 30 54 16 52 4 Z" fill="#FF6B3D" stroke="none"></path>
<path d="M66 30 C78 42 84 52 78 66 C74 82 62 94 48 94 C62 86 70 74 70 60 C70 48 68 40 66 30 Z" fill="#D9381E" stroke="none"></path>
<path d="M52 4 C64 26 84 38 78 64 C74 82 62 94 48 94 C32 94 20 82 22 62 C24 46 36 40 38 24 C44 32 46 38 50 42 C54 30 54 16 52 4 Z" fill="none"></path>
<path d="M50 48 C60 60 64 70 60 80 C57 87 44 88 41 80 C38 70 45 62 50 48 Z" fill="#FFE94A" stroke-width="4"></path>
<path d="M50 66 C54 72 55 78 52 82 C49 84 46 82 46 78 C46 74 48 72 50 66 Z" fill="#fff" stroke="none"></path>
<path d="M32 50 C30 56 30 62 32 66" stroke="#FFB08A" stroke-width="4" fill="none"></path>
<circle cx="80" cy="18" r="4" fill="#FFE94A" stroke-width="3"></circle>
<circle cx="22" cy="28" r="3" fill="#FF6B3D" stroke-width="2.5"></circle>
</g></sc-if>
<sc-if value="{{m.g.crown}}" hint-placeholder-val="{{ false }}"><g transform="rotate(-6 50 50)">
<path d="M10 72 L16 26 L34 50 L50 16 L66 50 L84 26 L90 72 Z" fill="#FFC23D" stroke="none"></path>
<path d="M50 16 L66 50 L84 26 L90 72 L58 72 Z" fill="#E09A12" stroke="none"></path>
<path d="M10 72 L16 26 L34 50 L50 16 L66 50 L84 26 L90 72 Z" fill="none"></path>
<path d="M20 64 L22 42 M44 36 L50 26" stroke="#fff" stroke-width="4" fill="none"></path>
<rect x="8" y="72" width="84" height="16" fill="#FF3D7F"></rect>
<circle cx="28" cy="80" r="4" fill="#FFE94A" stroke-width="3"></circle>
<circle cx="50" cy="80" r="5" fill="#2EFFE0" stroke-width="3"></circle>
<circle cx="72" cy="80" r="4" fill="#FFE94A" stroke-width="3"></circle>
<circle cx="50" cy="14" r="7" fill="#2EFFE0" stroke-width="4"></circle>
<circle cx="16" cy="24" r="5" fill="#B04BFF" stroke-width="3"></circle>
<circle cx="84" cy="24" r="5" fill="#B04BFF" stroke-width="3"></circle>
</g></sc-if>
<sc-if value="{{m.g.eye}}" hint-placeholder-val="{{ false }}"><g transform="rotate(-6 50 50)">
<path d="M4 50 C22 20 78 20 96 50 C78 80 22 80 4 50 Z" fill="#fff" stroke="none"></path>
<path d="M10 56 C28 74 72 74 90 56 C78 76 22 78 10 56 Z" fill="#D8CDEB" stroke="none"></path>
<path d="M4 50 C22 20 78 20 96 50 C78 80 22 80 4 50 Z" fill="none"></path>
<circle cx="52" cy="50" r="19" fill="#B04BFF"></circle>
<circle cx="52" cy="50" r="12" fill="#7A1FC4" stroke="none"></circle>
<circle cx="53" cy="50" r="7" fill="#0d0618" stroke="none"></circle>
<circle cx="45" cy="43" r="5" fill="#fff" stroke="none"></circle>
<path d="M18 30 L12 20 M34 22 L31 10 M52 20 L52 7 M70 22 L74 10 M84 30 L91 21" stroke-width="5" fill="none"></path>
</g></sc-if>
<sc-if value="{{m.g.key}}" hint-placeholder-val="{{ false }}"><g transform="rotate(-20 50 50)">
<rect x="42" y="43" width="52" height="14" fill="#FFC23D"></rect>
<rect x="42" y="50" width="52" height="7" fill="#E09A12" stroke="none"></rect>
<rect x="72" y="57" width="9" height="15" fill="#FFC23D"></rect>
<rect x="85" y="57" width="9" height="22" fill="#FFC23D"></rect>
<circle cx="27" cy="50" r="20" fill="#FFC23D"></circle>
<path d="M27 70 A20 20 0 0 0 47 50 L38 50 A11 11 0 0 1 27 61 Z" fill="#E09A12" stroke="none"></path>
<circle cx="27" cy="50" r="20" fill="none"></circle>
<circle cx="27" cy="50" r="8" fill="#3d2a05"></circle>
<path d="M14 40 C16 35 20 32 25 31" stroke="#fff" stroke-width="4" fill="none"></path>
<path d="M50 47 L66 47" stroke="#fff" stroke-width="3" fill="none"></path>
<path d="M60 43 L60 57 M66 43 L66 57" stroke-width="3" fill="none"></path>
</g></sc-if>
<sc-if value="{{m.g.star}}" hint-placeholder-val="{{ false }}"><g transform="rotate(8 50 50)">
<path d="M50 4 L62 36 L96 37 L69 58 L79 92 L50 72 L21 92 L31 58 L4 37 L38 36 Z" fill="#FF3D7F" stroke="none"></path>
<path d="M50 4 L62 36 L96 37 L69 58 L79 92 L50 72 Z" fill="#C2185B" stroke="none"></path>
<path d="M50 4 L62 36 L96 37 L69 58 L79 92 L50 72 L21 92 L31 58 L4 37 L38 36 Z" fill="none"></path>
<path d="M44 22 L40 36 M22 42 L34 44" stroke="#fff" stroke-width="5" fill="none"></path>
<circle cx="50" cy="50" r="7" fill="#FFE94A" stroke-width="3"></circle>
<path d="M90 8 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z" fill="#fff" stroke-width="2.5"></path>
<circle cx="8" cy="80" r="4" fill="#2EFFE0" stroke-width="2.5"></circle>
</g></sc-if>
</g>
</g>
</svg>
</div>
<div style="margin-top: 2px; font-family: 'Bungee', sans-serif; font-size: 15px; color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill; letter-spacing: 0.02em">{{m.name}}</div>
<div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px">
<span style="font-family: 'Bungee', sans-serif; font-size: 30px; line-height: 1; color: {{m.statColor}}; -webkit-text-stroke: 5px #000; paint-order: stroke fill">{{m.statNum}}</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; color: #fff">{{m.statKind}}</span>
</div>
<sc-if value="{{m.hasPerk}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 4px; padding: 1px 6px; background: #000; color: #2EFFE0; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px">+ {{m.perk}}</div>
</sc-if>
<div style="position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 14px; color: #FFE94A; letter-spacing: 0.1em; -webkit-text-stroke: 2px #000; paint-order: stroke fill">{{m.pipsText}}</div>
<sc-if value="{{m.shine}}" hint-placeholder-val="{{ false }}"><div class="mc-shine"></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"m":{"editor":null},"w":{"editor":null},"h":{"editor":null},"$preview":{"width":180,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    var w = Number(this.props.w) || 180;
    var h = Number(this.props.h) || 260;
    var m = this.props.m || {
      rarityName: 'LEGENDARY', oddsText: '1 IN 1K', name: 'GOLD KEY',
      fill: '#3d2a05', line: '#FFC23D', inner: '#b07a10',
      cogClass: 'mc-cog', toothClass: '', glow: true, shine: true,
      g: { key: true }, glyphFilter: 'none',
      statNum: '×3', statKind: 'WINS', statColor: '#FFE94A',
      hasPerk: true, perk: 'KEY −20%', pipsText: '★★☆☆☆'
    };
    return { w: w, h: h, s: w / 180, m: m };
  }
}
</script>
</body>
</html>
