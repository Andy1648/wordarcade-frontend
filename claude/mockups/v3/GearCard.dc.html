<style>
body{margin:0;font-family:'Space Mono',monospace;color:#fff;background:#0d0618}
@keyframes gcSpin{to{transform:rotate(360deg)}}
@keyframes gcBand{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes gcLift{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.gc-ring{transform-origin:60px 60px}
.gc-s0,.gc-s1{}
.gc-s2{animation:gcSpin 14s linear infinite}
.gc-s3{animation:gcSpin 10s linear infinite}
.gc-s4{animation:gcSpin 7s linear infinite}
.gc-s5{animation:gcSpin 3.5s linear infinite}
.gc-rb{position:absolute;left:0;top:0;bottom:0;width:200%;background:repeating-linear-gradient(90deg,#FF3D7F 0 50px,#FFC23D 50px 100px,#FFE94A 100px 150px,#2EFFE0 150px 200px,#3D8BFF 200px 250px,#B04BFF 250px 300px);animation:gcBand 2.4s linear infinite}
.gc-out{-webkit-text-stroke:5px #000;paint-order:stroke fill}
.gc-pick{cursor:pointer;background:none;border:0;padding:0;transition:transform .12s}
.gc-pick:hover{transform:translate(-3px,-3px)}
.gc-pick:active{transform:translate(3px,3px)}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":657}}'>
var RAR = [
  { name: 'COMMON',    odds: '1 IN 2',    line: '#A9B4C8', fill: '#262b38', deep: '#171a22', inner: '#3a4152', mult: '×1.1' },
  { name: 'RARE',      odds: '1 IN 10',   line: '#3D8BFF', fill: '#0f2350', deep: '#08142e', inner: '#173a80', mult: '×1.25' },
  { name: 'EPIC',      odds: '1 IN 100',  line: '#B04BFF', fill: '#2a0e4a', deep: '#170728', inner: '#4a1880', mult: '×1.5' },
  { name: 'LEGENDARY', odds: '1 IN 1K',   line: '#FFC23D', fill: '#3d2a05', deep: '#221702', inner: '#6b4a08', mult: '×2' },
  { name: 'MYTHIC',    odds: '1 IN 10K',  line: '#FF3D7F', fill: '#4a0a22', deep: '#2a0412', inner: '#80123f', mult: '×3' },
  { name: 'LONGINUS',  odds: '1 IN 100K', line: '#FFFFFF', fill: '#120a1e', deep: '#07040c', inner: '#2a1a40', mult: '×5' }
];
var RB = ['#FF3D7F', '#FFC23D', '#FFE94A', '#2EFFE0', '#3D8BFF', '#B04BFF'];
var BOARD = [
  { name: 'TWIN STRIKE',      r: 0, g: 'twin',    kind: 'WINS', d: 4 },
  { name: 'KEYBREAKER',       r: 1, g: 'breaker', kind: 'WINS', d: 2 },
  { name: 'DIVIDING CAPS',    r: 2, g: 'divide',  kind: 'WINS', d: 1 },
  { name: 'OVERCLOCK HEART',  r: 3, g: 'heart',   kind: 'WINS', d: 3 },
  { name: 'ABYSS SPACEBAR',   r: 4, g: 'abyss',   kind: 'WINS', d: 0 },
  { name: 'GOD-SLAYER CARET', r: 5, g: 'caret',   kind: 'WINS', d: 0 }
];
function cardVM(gr, s) {
  var R = RAR[gr.r], g = {}; g[gr.g] = true;
  var teeth = [], notches = [], pips = [], i;
  for (i = 0; i < 12; i++) teeth.push({ a: i * 30, c: gr.r === 5 ? RB[i % 6] : R.line });
  for (i = 0; i < 6; i++) notches.push(i * 60 + 15);
  for (i = 0; i < 5; i++) pips.push({ c: i < gr.d ? '#FFE94A' : '#3a2f4a' });
  return {
    name: gr.name, rarityName: R.name, oddsText: R.odds, line: R.line, fill: R.fill, deep: R.deep, inner: R.inner,
    ring: gr.r === 5 ? '#fff' : R.line, edge: '#000', spin: 'gc-s' + gr.r, rainbow: gr.r === 5,
    teeth: teeth, notches: notches, pips: pips, g: g, mult: R.mult, kind: gr.kind, s: s || 1
  };
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hero: 3 }; }
  renderVals() {
    var self = this, st = this.state;
    return {
      hero: cardVM(BOARD[st.hero], 1),
      cards: BOARD.map(function (b, i) { var vm = cardVM(b, 0.92); vm.pick = function () { self.setState({ hero: i }); }; if (i === st.hero) vm.edge = '#FFE94A'; return vm; })
    };
  }
}
</script>
