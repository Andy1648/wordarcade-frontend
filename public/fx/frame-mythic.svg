       hard black shadow; asymmetric on purpose. -->
  <g fill="#000" transform="translate(5 5) translate(90 130) scale(0.94) translate(-90 -130)">
    <path d="M6 34 C-6 22 -12 6 -18 -16 C0 -6 18 -2 34 6 C22 12 12 20 6 34 Z"/>
