<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 268" width="188" height="268">
  <!-- GEAR CARD BACK (ROLL REVEAL v2): the face-down card every reveal flips. Same silhouette as the card face
       (CardFrame: 180x260, rx 14, hard 6px shadow). House purple frame outlined in its darker shade, a bold pink slash
       behind a cog emblem with a "?" in it, two drips off the bottom edge and a little overspray. Flat fills only.
       It is the SAME back for every rarity — the rarity colour comes from the telegraph layer (LEGENDARY+), never the art. -->
  <defs>
    <clipPath id="cb-panel"><rect x="11" y="12" width="158" height="236" rx="9"/></clipPath>
  </defs>
  <g fill="#000">
    <rect x="8" y="8" width="176" height="256" rx="14"/>
  </g>
  <rect x="2" y="2" width="176" height="256" rx="14" fill="#9A1AFF" stroke="#5c0fa3" stroke-width="5"/>
  <rect x="11" y="12" width="158" height="236" rx="9" fill="#1a0b2e" stroke="#5c0fa3" stroke-width="3"/>
  <g clip-path="url(#cb-panel)">
