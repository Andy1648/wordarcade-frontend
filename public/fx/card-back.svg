    <path d="M11 150 L169 64 L169 98 L11 184 Z" fill="#FF4FA3" stroke="#b3246f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M11 196 L169 110 L169 118 L11 204 Z" fill="#2a1150"/>
  </g>
  <rect x="11" y="12" width="158" height="236" rx="9" fill="none" stroke="#5c0fa3" stroke-width="3"/>
  <!-- the emblem: a cog (black ink) with an ink disc and a cyan "?" -->
