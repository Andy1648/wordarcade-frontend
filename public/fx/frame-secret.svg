<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 228 308" width="228" height="308">
  <!-- SECRET FRAME VARIANT (gear UI v3, Andy oct9 "mythic and secret should be even greater"): laid over the card's
       180x260 frame (CardFrame.jsx) — thick corner brackets printed off-register (a cyan and a pink plate knocked
       sideways under the white one: the GLITCH), torn scan-line slices off both edges, and a rainbow-ringed star
       crowning the rarity plate. Flat fills, hard black shadow; nothing symmetric. -->
  <!-- the off-register plates (cyan left, pink right) -->
  <g fill="none" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#2EFFE0" transform="translate(-4 0)">
      <path d="M-8 34 V-8 H34"/><path d="M146 -8 H188 V34"/><path d="M-8 226 V268 H34"/><path d="M146 268 H188 V226"/>
    </g>
    <g stroke="#FF3D7F" transform="translate(4 1)">
      <path d="M-8 34 V-8 H34"/><path d="M146 -8 H188 V34"/><path d="M-8 226 V268 H34"/><path d="M146 268 H188 V226"/>
    </g>
    <!-- the white key plate, inked -->
    <g stroke="#000" stroke-width="13">
      <path d="M-8 34 V-8 H34"/><path d="M146 -8 H188 V34"/><path d="M-8 226 V268 H34"/><path d="M146 268 H188 V226"/>
    </g>
    <g stroke="#fff">
      <path d="M-8 34 V-8 H34"/><path d="M146 -8 H188 V34"/><path d="M-8 226 V268 H34"/><path d="M146 268 H188 V226"/>
    </g>
  </g>
  <!-- torn scan-line slices off the edges -->
  <rect x="-16" y="72" width="26" height="6" fill="#2EFFE0" stroke="#000" stroke-width="2"/>
  <rect x="-10" y="80" width="14" height="3" fill="#FF3D7F"/>
  <rect x="166" y="150" width="30" height="6" fill="#FF3D7F" stroke="#000" stroke-width="2"/>
  <rect x="176" y="158" width="16" height="3" fill="#FFC23D"/>
  <rect x="170" y="196" width="22" height="5" fill="#2EFFE0" stroke="#000" stroke-width="2"/>
  <rect x="-14" y="182" width="18" height="4" fill="#B04BFF" stroke="#000" stroke-width="1.5"/>
  <!-- the crown: a rainbow ring round a white star, over the rarity plate -->
  <g transform="translate(90 -8)">
    <circle r="15" fill="#000" transform="translate(3 3)"/>
    <circle r="15" fill="#000"/>
    <path d="M0 -13 A13 13 0 0 1 12.4 -4" stroke="#FF3D7F" stroke-width="5" fill="none"/>
    <path d="M12.4 -4 A13 13 0 0 1 7.6 10.5" stroke="#FFC23D" stroke-width="5" fill="none"/>
    <path d="M7.6 10.5 A13 13 0 0 1 -7.6 10.5" stroke="#2EFFE0" stroke-width="5" fill="none"/>
    <path d="M-7.6 10.5 A13 13 0 0 1 -12.4 -4" stroke="#3D8BFF" stroke-width="5" fill="none"/>
    <path d="M-12.4 -4 A13 13 0 0 1 0 -13" stroke="#B04BFF" stroke-width="5" fill="none"/>
    <path d="M0 -9 L2.6 -2.8 L9 -2.6 L4 1.6 L5.6 8 L0 4.4 L-5.6 8 L-4 1.6 L-9 -2.6 L-2.6 -2.8 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
