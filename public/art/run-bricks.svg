<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32" shape-rendering="crispEdges">
  <!-- run-bricks.svg — the RUN wall slab's brick tile (repeats). Flat pink bricks, darker
       mortar, one chipped corner per row so the pattern reads hand-set, not wallpaper. -->
  <rect width="64" height="32" fill="#c2337a"/>
  <rect x="1" y="1" width="30" height="13" fill="#FF4FA3"/>
  <rect x="33" y="1" width="30" height="13" fill="#FF4FA3"/>
  <rect x="17" y="17" width="30" height="13" fill="#FF4FA3"/>
  <rect x="49" y="17" width="14" height="13" fill="#FF4FA3"/>
  <rect x="1" y="17" width="14" height="13" fill="#FF4FA3"/>
  <rect x="29" y="12" width="2" height="2" fill="#c2337a"/>
  <rect x="45" y="17" width="2" height="2" fill="#c2337a"/>
  <rect x="1" y="28" width="2" height="2" fill="#c2337a"/>
</svg>
