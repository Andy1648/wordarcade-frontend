<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="pa" aria-hidden="true">
  <!-- CHAIN — three interlocking links, the middle one snapping tight on the beat. Teal neon. -->
  <g class="pa-shadow" transform="translate(5 6)">
    <rect x="14" y="44" width="92" height="34" rx="17" fill="#000" opacity="0.9"/>
  </g>
  <circle cx="16" cy="30" r="2.4" fill="#2EFFE0"/>
  <circle cx="104" cy="92" r="2.2" fill="#2EFFE0"/>
  <!-- left link -->
  <rect x="12" y="46" width="44" height="30" rx="15" fill="none" stroke="#0A3B34" stroke-width="11"/>
  <rect x="12" y="46" width="44" height="30" rx="15" fill="none" stroke="#2EFFE0" stroke-width="5"/>
  <!-- right link -->
  <rect x="64" y="46" width="44" height="30" rx="15" fill="none" stroke="#0A3B34" stroke-width="11"/>
  <rect x="64" y="46" width="44" height="30" rx="15" fill="none" stroke="#2EFFE0" stroke-width="5"/>
  <!-- centre link (snaps on beat) -->
  <g class="pa-spark">
    <rect x="42" y="38" width="36" height="46" rx="18" fill="#0d0618" stroke="#0A3B34" stroke-width="11"/>
    <rect x="42" y="38" width="36" height="46" rx="18" fill="none" stroke="#FFE94A" stroke-width="5"/>
    <text x="60" y="66" font-size="16" font-weight="700" text-anchor="middle" font-family="Bungee, sans-serif" fill="#2EFFE0">N</text>
  </g>
</svg>
