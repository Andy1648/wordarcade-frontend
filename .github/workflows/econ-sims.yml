# ECON SIMS on CI (Andy oct3 11:46, throughput rule 1): the economy sims are too heavy for the laptop, so they
# run here. Two jobs:
#   rule-p   — RULE P (Andy oct2 22:25): claude/econ-oct2/compare.sh runs loop-sim (3 skills × every window,
#              20 h) on main and on this branch for N seeds and compares the MEAN of every window metric.
#              It REPORTS the verdict (MERGE / HOLD) in the job summary + artifact; it does not fail the
#              check, because a HOLD is a decision for Andy, not a broken build.
#   long-run — one long loop-sim run of this branch (default 200 h) for reach times (LV50/100/225/300/400).
#              It FAILS the job on loop-sim's HARD CHECK (021 server-checked rebirth, Andy oct5 phase 1): any bot —
#              incl. the SPAMMER (1,000 rebirth calls + replays every menu return) and FAST — beating 2x the median's
#              rebirths at 60/300/600 min, or the server model granting a rebirth below the gate. loop-sim exits 1.
# Triggers: on a PR that touches the economy (src/progress, claude/econ-oct2) and by hand (workflow_dispatch,
# with hours / seeds inputs). Reports land as the `econ-sims` artifact and in the run's summary.
name: Econ sims

on:
  pull_request:
    paths:
      - 'src/progress/**'
      - 'claude/econ-oct2/**'
      - 'src/leaderboard/**'
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours for the long run'
        default: '10'
      seeds:
        description: 'Seeds for the rule-P compare'
        default: '5'
      s2probes:
        description: 'SEASON2 probes: JSON [{"name":..,"patch":[[file,find,repl],..]},..] run after the main s2 sim (constant tuning)'
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rule-p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rule P compare (main → this branch)
        run: |
          bash claude/econ-oct2/compare.sh "$PWD/base/src" "$PWD/src" ci "${{ github.event.inputs.seeds || '5' }}" | tee rule-p.txt
          {
            echo '## Rule P (main → this branch, mean of seeds)'
            echo '```'
            grep -E 'WORSE|VERDICT' rule-p.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: econ-sims-rule-p
          path: |
            rule-p.txt
            claude/econ-oct2/loop-sim-ci-*.json
          retention-days: 14

  # SEASON2 (PROGRESSION v3, Andy oct5 phase 3): loop-sim's v3 mode (SIM_SEASON2=1) — the spec's bots (casual 60/8,
  # median 100/14, fast 160/26) + the SPAMMER and the MASHER, 10 h, through the shipped v3 code behind the flag. FAILS on
  # its HARD CHECK (any bot > 2x the median's rebirths at 60/300/600 min, FAST > 2x the median's pace to R1/R5/R10, a
  # server grant below the v3 gate, or the spammer not ending level with the median). The targets table (first time
  # to R1 / R5 / R10 vs the spec, levels at 10 h) goes into the job summary.
  season2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SEASON2 10 h (v3 targets + HARD CHECK)
        env:
          S2PROBES: ${{ github.event.inputs.s2probes || '' }}
        run: |
          set +e
          SIM_SEASON2=1 SIM_SRC=src node claude/econ-oct2/loop-sim.mjs --tag=ci-s2 --hours="${{ github.event.inputs.hours || '10' }}" > s2-run.txt 2>&1
          rc=$?
          set -e
          cat s2-run.txt
          {
            echo '## SEASON2 (progression v3) — first time to R1 / R5 / R10 vs the spec'
            grep -E '^\|' s2-run.txt || true
            echo '```'
            grep -E '^=== S2|first time to|at 10 h|S2 HARD|FAST pace|[0-9]+m: |server\[|SPAMMER|WINS by|GEMS ' s2-run.txt || true
            echo '```'
            echo "exit code: $rc"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$S2PROBES" ]; then
            echo "$S2PROBES" > s2-probes.json
            node claude/econ-oct2/s2-probes.mjs s2-probes.json "${{ github.event.inputs.hours || '10' }}" > s2-probes.txt 2>&1 || true
            cat s2-probes.txt
            { echo '## SEASON2 probes'; cat s2-probes.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::SEASON2 HARD CHECK failed — a bot beat 2x the median's pace, or the server granted a rebirth below the v3 gate"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: econ-sims-season2
          path: |
            s2-run.txt
            s2-probes.txt
            claude/econ-oct2/loop-sim-ci-s2*.json
          retention-days: 14

  # SEASON 2 CONVERSION (Andy oct6, no reset): every REAL board row (claude/econ-oct2/board-snapshot-oct6.json) converted
  # by src/progress/v3/convert.js, then played 2 h by the median bot from that state (MIN / TYP / MAX save each). FAILS
  # on the HARD RULE: any row faster than 2x the median v3 pace (the median clock), any row whose next rebirth is not
  # inside 2 h of median play, or a converted ★ above the median's standing after the same rebirths. --grid prints the
  # rate search that picked convert.js RATES.
  season2-board:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SEASON2 board conversion (HARD RULE)
        run: |
          set +e
          SIM_SEASON2=1 SIM_SRC=src node claude/econ-oct2/loop-sim.mjs --board --grid --tag=ci-s2-board > s2-board.txt 2>&1
          rc=$?
          set -e
          cat s2-board.txt
          {
            echo '## SEASON2 conversion — every real board row after convert.js (HARD RULE)'
            grep -E 'SHIPPED RATES|S2 BOARD HARD RULE|GRID PICK' s2-board.txt || true
            grep -E '^\|' s2-board.txt || true
            echo '```'
            grep -E 'MEDIAN CLOCK|first stood|POWER at each|GRID |diagnostic' s2-board.txt | cut -c1-900 || true
            echo '```'
            echo "exit code: $rc"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::SEASON2 conversion HARD RULE failed — a converted board row beat 2x the median v3 pace, is stuck past 2 h, or out-ranks the median's standing"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: econ-sims-season2-board
          path: |
            s2-board.txt
            claude/econ-oct2/loop-sim-ci-s2-board.json
          retention-days: 14

  long-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Long run (3 skills + FAST + SPAMMER) — fails on the HARD CHECK
        run: |
          # PROGRESSION FINAL targets are for 10 h with NO marks (SIM_ROLLS=0); then the same 10 h WITH rolls (runaway check)
          # Both runs carry the HARD CHECK (exit 1); the summary is written first, then the job fails if either failed.
          set +e
          SIM_ROLLS=0 SIM_SRC=src node claude/econ-oct2/loop-sim.mjs --tag=ci-long --hours="${{ github.event.inputs.hours || '10' }}" > long-run.txt 2>&1
          rc1=$?
          SIM_SRC=src node claude/econ-oct2/loop-sim.mjs --tag=ci-rolls --hours="${{ github.event.inputs.hours || '10' }}" --no-masher > rolls-run.txt 2>&1
          rc2=$?
          set -e
          cat long-run.txt
          grep -E '^=== |RR TARGETS|ROLLS|HARD|[0-9]+m: |server\[|SPAMMER' rolls-run.txt | sed 's/^/[rolls] /' >> long-run.txt || true
          {
            echo '## Long run — first reach of each level (minutes)'
            echo '```'
            grep -E '^=== |reach \(min\)|KE |v11 |MASHER|FAST' long-run.txt || true
            echo '```'
            echo "## HARD CHECK (server-checked rebirth) — exit codes: long $rc1, rolls $rc2"
            echo '```'
            grep -E 'HARD|[0-9]+m: |server\[|SPAMMER' long-run.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            echo "::error::loop-sim HARD CHECK failed (long $rc1, rolls $rc2) — a bot beat 2x the median's rebirths or the server granted a rebirth below the gate"
            exit 1
          fi
      - name: Board saves (every real board save, median bot, 3 h)
        if: ${{ !cancelled() }}
        run: |
          SIM_SRC=src node claude/econ-oct2/loop-sim.mjs --board --hours=3 --tag=ci-board | tee board.txt
          {
            echo '## Board saves'
            echo '```'
            cat board.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: econ-sims-long-run
          path: |
            long-run.txt
            rolls-run.txt
            board.txt
            claude/econ-oct2/loop-sim-ci-long.json
          retention-days: 14
